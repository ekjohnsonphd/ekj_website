project:
  type: website
  output-dir: docs
  pre-render: python3 build-site.py
  render:
    - "*.qmd"
    - "cv/*.qmd"
    - "!claude-examples/"
    - "!_email-version/"
    - "!_drafts/"
  resources:
    - CNAME
    - .nojekyll
    - "_assets/fonts/*.woff2"

description-meta: "Emily K. Johnson, Assistant Professor at the Danish Centre for Health Economics, University of Southern Denmark. Population health measurement and health economics."
author-meta: "Emily K. Johnson"

website:
  title: "Emily K. Johnson"
  description: "Population health measurement and health economics. Assistant Professor, Danish Centre for Health Economics, University of Southern Denmark."
  image: "_assets/images/IMG_0803.jpeg"
  site-url: "https://ekjohnson.com"
  open-graph: true
  search: false

  navbar:
    title: "Emily K. Johnson"
    collapse-below: md
    right:
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Talks and teaching
        href: talks.qmd
      - text: CV
        href: cv/index.qmd

  page-footer:
    left: "Emily K. Johnson, University of Southern Denmark"
    right:
      - text: Email
        href: mailto:ejohnson@health.sdu.dk
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=upRo6SsAAAAJ&hl=en
      - text: ORCID
        href: https://orcid.org/0000-0001-9213-9533
      - text: GitHub
        href: https://github.com/ekjohnsonphd
      - text: LinkedIn
        href: https://www.linkedin.com/in/emilykatherinejohnson/

format:
  html:
    theme: [default, theme.scss]
    css: site.css
    page-layout: custom
    toc: false
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    anchor-sections: false
    smooth-scroll: false
