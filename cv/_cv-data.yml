summary: >
  Health economist and population health researcher, trained as a statistician and health data scientist.
  My work measures population health and its economic consequences using administrative data at national
  scale, with methods spanning register-based causal inference, machine learning, and Bayesian modelling.
  Before my PhD I spent four years as a Research Scientist at the Institute for Health Metrics and Evaluation
  and two years at Epic Systems. I collaborate with research groups at the University of Oxford, the Institute
  for Health Metrics and Evaluation, Johns Hopkins University, and Yale University.

